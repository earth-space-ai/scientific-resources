name: Validate deterministic build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both host profiles
        run: python3 src/generate.py
      - name: Run standard-library validation
        run: python3 -m unittest discover -s tests -v
      - name: Confirm generated artifacts are current
        run: git diff --exit-code -- dist
      - name: Upload reviewed host pair
        uses: actions/upload-artifact@v4
        with:
          name: scientific-resources-dist
          path: dist/
          if-no-files-found: error
